<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="../Style/Style.css">
    <script src="../Script/Script.js" defer></script>
</head>

<body>
    <main>
        <section>
            <form class="Pokedex">
             <div class="Imagem">
                <label for="Imagem" class="form-label">Imagem</label>
                <img src="" id="Imagem">
             </div>
             <div class="Nome">
                <label for="Nome" class="form-label">Nome</label>
                <input id="Nome" class="form-label" type="text">
             </div>
             <div class="Altura">
                <label for="Altura" class="form-label">Altura</label>
                <input id="Altura" class="form-label" type="text">
             </div>
             <div class="Peso">
                <label for="Peso" class="form-label">Peso</label>
                <input id="Peso" class="form-label" type="text">
             </div>
             <div class="Tipo">
                <label for="Tipo" class="form-label">Tipo</label>
                <input id="Tipo" class="form-label" type="text">
             </div>
             <div class="Ataque">
                <label for="Ataque" class="form-label">Ataque</label>
                <input id="Ataque" class="form-label" type="text">
             </div>
             <div class="Defesa">
                <label for="Defesa" class="form-label">Defesa</label>
                <input id="Defesa" class="form-label" type="text">
             </div>
             <div class="HP">
                <label for="HP" class="form-label">HP</label>
                <input id="HP" class="form-label" type="text">
             </div>
             <div class="Velocidade">
                <label for="Velocidade" class="form-label">Velocidade</label>
                <input id="Velocidade" class="form-control" type="text">
             </div>
                </form>
        </section>
    </main>
</body>

</html>
