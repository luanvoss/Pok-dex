<!DOCTYPE html>
<html lang="PT-BR">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Pokédex</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"
      defer></script>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
   <link rel="stylesheet" href="../Style/Style.css">
   <script src="../Script/Script.js" defer></script>
</head>

<body>
   <header>
      <img src="../Imagens/bbf847ae-ec90-4631-9900-e652bdc7fe4b.png" alt="Logo">
   </header>
   <main>
      <section>
         <div id="gridPokemon"></div>
         <form class="Pokedex">
            <div class="Imagem">
               <label for="Imagem" class="form-label">Imagem</label>
               <img src="" id="Imagem">
            </div>
         </form>
      </section>
      <div class="modal" id="pokemonModal" tabindex="-1">
         <div class="modal-dialog">
            <div class="modal-content">
               <div class="modal-header">
                  <h5 class="modal-title" id="modalTitle"></h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
               </div>
               <div class="modal-body" id="modalBody">
                  <p>Modal body text goes here.</p>
               </div>
            </div>
         </div>
      </div>
   </main>
   <footer class="footer">
      <div class="footer-content">
         <p>
            Explore, descubra e conheça os Pokémons! ⚡
            <h3>LEGENDA</h3>
          <p>🔥 Fogo → Vermelho</p>
    <p>💧 Água → Azul</p>
    <p>🌿 Planta → Verde</p>
    <p>⚡ Elétrico → Amarelo</p>
    <p>👻 Fantasma → Roxo</p>
    <p>🧊 Gelo → Azul-claro</p>
    <p>🪨 Pedra → Marrom</p>
    <p>🐉 Dragão → Azul/Roxo</p>
         <img src="../Imagens/pikachu (2).gif" alt="gif">
      </div>
   </footer>
</body>

</html>
